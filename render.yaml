services:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Java 21 Spring Boot, built and run via Docker
  # Render builds this using backend/Dockerfile (multi-stage Maven + JRE)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: medicare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/departments
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
