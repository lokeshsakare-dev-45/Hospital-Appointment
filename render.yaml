services:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Java 21 Spring Boot, built and run via Docker
  # Render builds this using backend/Dockerfile (multi-stage Maven + JRE)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: medicare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/departments
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m -Xms256m"

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — React + Vite, deployed as a static site
  # Render runs: npm install && npm run build  inside frontend/
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: medicare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
