services:
  # ── Backend: Java 21 Spring Boot via Docker ───────────────────────────────
  # Render builds backend/Dockerfile from the repo root.
  # dockerContext: ./backend  means COPY instructions in the Dockerfile
  # are relative to the backend/ folder (where pom.xml lives).
  - type: web
    name: medicare-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/departments
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Frontend: React + Vite static site ───────────────────────────────────
  - type: web
    name: medicare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
