# ── Server ───────────────────────────────────────────────────────────────────
# Render injects PORT at runtime. Falls back to 8080 locally.
server.port=${PORT:8080}

# ── Datasource ───────────────────────────────────────────────────────────────
# Set these three environment variables in Render → Environment tab:
#   SPRING_DATASOURCE_URL      e.g. jdbc:mysql://host:port/dbname?useSSL=true&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME e.g. root
#   SPRING_DATASOURCE_PASSWORD your database password
#
# The :jdbc:... fallback keeps the app working on your local machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hospital_appointment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool — keeps Render free tier alive longer
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
